name: Tests on Pull Requests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0, immutable=true
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable=false
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0, immutable=false

      - name: Install Golang unit tests dependencies
        run: |
          make install-go-tests

      - name: Install Helm Chart unittest plugin
        run: |
          make install-helm-unittests

      - name: Run the Golang unit tests
        run: |
          make go-tests

      - name: Run the Helm Chart unit tests
        run: |
          make helm-unittests

      - name: Run the Helm Chart lint
        run: |
          make helm-lint
